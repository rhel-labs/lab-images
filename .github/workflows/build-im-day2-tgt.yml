name: Build im-day2-tgt image

on:
  push:
    branches: [main]
    paths:
      - im-day2-tgt/**
  pull_request:
    branches: [main]
    paths:
      - im-day2-tgt/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RHT_ORGID: ${{ secrets.RHT_ORGID }}
  RHT_ACT_KEY: ${{ secrets.RHT_ACT_KEY }}
  SOURCE_REGISTRY_USER: ${{ secrets.RHT_REG_SVCUSER }}
  SOURCE_REGISTRY_PASSWORD: ${{ secrets.RHT_REG_SVCPASS }}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Install updated container tools
        run: |
          set -euo pipefail
          echo "deb http://azure.archive.ubuntu.com/ubuntu plucky universe main" \
            | sudo tee /etc/apt/sources.list.d/plucky.list
          printf 'Package: *\nPin: release n=plucky\nPin-Priority: 100\n' \
            | sudo tee /etc/apt/preferences.d/plucky.pref
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends crun/plucky podman/plucky

      - name: Build image
        run: |
          set -euo pipefail
          podman volume create build-storage
          podman run --rm --privileged \
            -v build-storage:/var/lib/containers \
            -v ${{ github.workspace }}:/build \
            -e SMDEV_CONTAINER_OFF=1 \
            -e RHT_ORGID -e RHT_ACT_KEY \
            -e SOURCE_REGISTRY_USER -e SOURCE_REGISTRY_PASSWORD \
            registry.access.redhat.com/ubi9/ubi bash -c '
              set -euo pipefail
              dnf -y install buildah
              subscription-manager register --org="${RHT_ORGID}" --activationkey="${RHT_ACT_KEY}"
              trap "subscription-manager unregister" EXIT
              buildah login -u "${SOURCE_REGISTRY_USER}" -p "${SOURCE_REGISTRY_PASSWORD}" registry.redhat.io
              buildah bud -f /build/im-day2-tgt/Containerfile -t ghcr.io/rhel-labs/im-day2-tgt:latest /build/im-day2-tgt
            '

      - name: Push image
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          STORAGE_ROOT=$(podman volume inspect build-storage --format '{{.Mountpoint}}')
          podman login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
          podman --root "${STORAGE_ROOT}/storage" push ghcr.io/rhel-labs/im-day2-tgt:latest

      - name: Cleanup build storage
        if: always()
        run: podman volume rm -f build-storage
