name: Build rhhi-demo images

on:
  push:
    branches: [main]
    paths:
      - rhhi-demo/**

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push hardened variant
        uses: docker/build-push-action@v6
        with:
          context: rhhi-demo/
          file: rhhi-demo/Containerfile.hardened
          push: true
          tags: ghcr.io/rhel-labs/rhhi-demo:hardened

      - name: Build and push ubi variant
        uses: docker/build-push-action@v6
        with:
          context: rhhi-demo/
          file: rhhi-demo/Containerfile.ubi
          push: true
          tags: ghcr.io/rhel-labs/rhhi-demo:ubi
