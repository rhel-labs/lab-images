name: Build registry image

on:
  push:
    branches: [main]
    paths:
      - registry/**

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: registry/
          file: registry/Containerfile
          push: true
          tags: ghcr.io/rhel-labs/registry:latest
