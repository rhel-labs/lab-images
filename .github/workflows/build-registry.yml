name: Build registry image

on:
  push:
    branches: [main]
    paths:
      - registry/**
  pull_request:
    branches: [main]
    paths:
      - registry/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/install-container-tools

      - name: Build image
        run: podman build -t ghcr.io/rhel-labs/registry:latest registry/

      - name: Smoke test
        run: |
          podman run -d --name registry-test -p 5000:5000 ghcr.io/rhel-labs/registry:latest
          curl -sf --retry 5 --retry-delay 2 --retry-connrefused http://localhost:5000/v2/ \
            | grep -q '{}'
          podman stop registry-test

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name != 'pull_request'
        run: podman push ghcr.io/rhel-labs/registry:latest
