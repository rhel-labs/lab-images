name: Build python hostinfo app image


on:
  push:
    branches: [main]
    paths:
      - hostinfo-app/**
  pull_request:
    branches: [main]
    paths:
      - hostinfo-app/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/install-container-tools

      - name: Build application image
        run: podman build -t ghcr.io/rhel-labs/hostinfo-app:latest -f hostinfo-app/Containerfile hostinfo-app/

      - name: Smoke test
        run: |
          set -euo pipefail
          podman run -d --name hostinfo-app --pull=never -p 8080:8080 ghcr.io/rhel-labs/hostinfo-app:latest
          sleep 2
          curl -sf --retry 5 --retry-delay 2 --retry-connrefused http://localhost:8080/data?view \
            | grep -q 'distro_id'
          podman stop hostinfo-app

      - name: Dump container logs on failure
        if: failure()
        run: |
          podman logs hostinfo-app 2>&1 || true

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images
        if: github.event_name != 'pull_request'
        run: |
          podman push ghcr.io/rhel-labs/hostinfo-app:latest
