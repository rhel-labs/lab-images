name: Renovate

on:
  schedule:
    - cron: '0 8 * * 1'  # weekly, Monday 08:00 UTC
  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: renovatebot/github-action@v46.2.0
        with:
          configurationFile: renovate.json
          token: ${{ secrets.GITHUB_TOKEN }}
