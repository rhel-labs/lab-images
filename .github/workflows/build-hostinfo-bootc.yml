name: Build hostinfo bootc image

on:
  push:
    branches: [main]
    paths:
      - hostinfo-bootc/**
  pull_request:
    branches: [main]
    paths:
      - hostinfo-bootc/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RHT_ORGID: ${{ secrets.RHT_ORGID }}
  RHT_ACT_KEY: ${{ secrets.RHT_ACT_KEY }}
  SOURCE_REGISTRY_USER: ${{ secrets.RHT_REG_SVCUSER }}
  SOURCE_REGISTRY_PASSWORD: ${{ secrets.RHT_REG_SVCPASS }}

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch app source from python-hostinfo
        run: |
          git clone --depth=1 https://github.com/rhel-labs/python-hostinfo.git /tmp/python-hostinfo
          cp -r /tmp/python-hostinfo/app ${{ github.workspace }}/hostinfo-bootc/app

      - name: Build image
        run: |
          set -euo pipefail
          RHEL_VER=$(grep -oP 'rhel\K\d+' hostinfo-bootc/Containerfile | head -1)
          podman volume create build-storage
          podman run --rm --privileged \
            -v build-storage:/var/lib/containers \
            -v ${{ github.workspace }}:/build \
            -e SMDEV_CONTAINER_OFF=1 \
            -e RHT_ORGID -e RHT_ACT_KEY \
            -e SOURCE_REGISTRY_USER -e SOURCE_REGISTRY_PASSWORD \
            registry.access.redhat.com/ubi${RHEL_VER}/ubi bash -c '
              set -euo pipefail
              dnf -y install buildah
              subscription-manager register --org="${RHT_ORGID}" --activationkey="${RHT_ACT_KEY}"
              trap "subscription-manager unregister" EXIT
              buildah login -u "${SOURCE_REGISTRY_USER}" -p "${SOURCE_REGISTRY_PASSWORD}" registry.redhat.io
              buildah bud -f /build/hostinfo-bootc/Containerfile -t ghcr.io/rhel-labs/hostinfo-bootc:latest /build/hostinfo-bootc
            '

      - name: Push image
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          STORAGE_ROOT=$(podman volume inspect build-storage --format '{{.Mountpoint}}')
          podman login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
          podman --root "${STORAGE_ROOT}/storage" push ghcr.io/rhel-labs/hostinfo-bootc:latest

      - name: Cleanup build storage
        if: always()
        run: podman volume rm -f build-storage
